name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    env:
      # Scripts and reports are UTF-8 with Chinese text; the Windows runner
      # otherwise uses a legacy code page and child processes die on print().
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile all scripts
        run: python -m compileall -q scripts

      - name: Lint (pyflakes + syntax)
        run: python -m ruff check scripts tests

      - name: Run tests
        run: python -m pytest tests -q
